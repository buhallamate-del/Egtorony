<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Égtorony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: egyoszlopos telefonos harcképernyő – ellenfél fent, erőarány-sáv középen, te és a mozdulataid lent. Szándékosan egy, éjszakai ég-téma. */
:root{
  --bg:#141731; --panel:#1e2246; --panel-2:#262b56; --line:#363c72; --ink:#eceefe; --muted:#9ca2d2;
  --ki:#62d0ff; --hp:#ff6b5a; --gold:#ffcd57; --good:#7fe0a3; --on-acc:#0d1030;
  --f-display:"Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:grid;gap:14px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
p{margin:0}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:600 14.5px var(--f-body);padding:12px 14px;border-radius:10px;cursor:pointer;text-align:left;line-height:1.25;width:100%}
.btn:focus-visible{outline:2px solid var(--ki);outline-offset:2px}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--ki);color:var(--on-acc);border-color:var(--ki);text-align:center;font-family:var(--f-display);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-acc);text-align:center;font-weight:700}
.btn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.btn.primary small,.btn.gold small{color:var(--on-acc);opacity:.75}
.btn .cost{float:right;font-weight:700;color:var(--ki);margin-left:8px}
.btn .cost.g{color:var(--gold)}
.btn.form-on,.btn.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ghost{appearance:none;background:none;border:0;color:var(--muted);text-decoration:underline;font:600 13px var(--f-body);cursor:pointer;padding:6px 0;justify-self:start}

.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pl{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:38px;line-height:1;letter-spacing:.02em}
.pl.small{font-size:26px}
.pl .mult{font-size:15px;color:var(--ink);margin-left:6px;vertical-align:middle;background:var(--panel-2);padding:2px 8px;border-radius:999px;border:1px solid var(--gold)}
.bar{position:relative;height:12px;border-radius:999px;background:#0e1029;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .35s ease-out}
.bar.hp i{background:var(--hp)}
.bar.ki i{background:var(--ki)}
.bar-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.bar-row .v{color:var(--muted);min-width:76px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.chip.gold{color:var(--gold);border-color:var(--gold)}
.chip.ki{color:var(--ki);border-color:var(--ki)}
.chip.hp{color:var(--hp);border-color:var(--hp)}

.title{padding-block:4px 6px;display:grid;gap:8px}
.title h1{font-size:56px;line-height:.95;letter-spacing:.04em;text-transform:uppercase}
.title h1 span{color:var(--gold)}
.title p{color:var(--muted);max-width:44ch}

.enemy .name{font-family:var(--f-display);font-size:22px;font-weight:600}
.intent-wrap{display:grid;gap:5px;justify-items:start}
.intent{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;background:#0e1029;border:1px solid var(--line)}
.intent.danger{border-color:var(--hp);color:var(--hp)}
.intent.calm{border-color:var(--good);color:var(--good)}
.intent.warn{border-color:var(--gold);color:var(--gold)}
.ratio{display:grid;gap:6px}
.ratio-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#0e1029}
.ratio-bar .me{background:var(--gold)}
.ratio-bar .them{background:var(--hp);opacity:.75}
.ratio-txt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;gap:8px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{padding:10px 12px;font-size:14px}
.hit{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.pop{position:absolute;right:14px;top:8px;font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--hp);pointer-events:none;animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{transform:translateY(8px) scale(.8);opacity:0}15%{transform:none;opacity:1}70%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.turn{gap:8px;border-color:var(--panel-2)}
.turn p{font-size:13.5px}
.tline{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:13.5px;line-height:1.4}
.tline b{font-family:var(--f-display);font-weight:600;letter-spacing:.04em}
.tline span b{font-family:var(--f-body);font-weight:700;color:var(--ink)}
.tline.me b:first-child{color:var(--gold)}
.tline.foe b:first-child{color:var(--hp)}
.tline.sys b:first-child{color:var(--ki)}
.help{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.help summary{cursor:pointer;font-weight:700;color:var(--ink)}
.help ol,.help ul{margin:8px 0 0;padding-left:20px;display:grid;gap:5px}

.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.glyph{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;background:#0e1029;border:1px solid var(--line)}
.glyph.harc{color:var(--hp);border-color:var(--hp)}
.glyph.elit{color:var(--gold);border-color:var(--gold)}
.glyph.boss{color:var(--on-acc);background:var(--gold);border-color:var(--gold)}
.glyph.edzes,.glyph.mester{color:var(--ki);border-color:var(--ki)}
.glyph.medit{color:var(--good);border-color:var(--good)}
.glyph.legendas{color:var(--on-acc);background:var(--ki);border-color:var(--ki)}
.glyph.kapu{color:var(--ink);background:#4b2a6e;border-color:#8a5cc7}
.glyph.osveny{color:var(--good);border-color:var(--good);border-style:dashed}
.floorbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.floorbar span{height:6px;border-radius:2px;background:#0e1029}
.floorbar span.done{background:var(--ki)}
.floorbar span.boss{background:var(--line)}
.floorbar span.boss.done{background:var(--gold)}
.floorbar span.now{background:var(--ink)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-grid .v{font-family:var(--f-display);font-size:20px;font-weight:600}
.meta-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.meta-item:first-of-type{border-top:0}
.meta-item .btn{width:auto;min-width:86px;text-align:center;padding:8px 10px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.stepper .btn{text-align:center;font-size:20px;padding:8px}
.stepper .lvl{text-align:center;font-family:var(--f-display);font-size:26px;color:var(--gold)}
.asc-list{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.asc-list li.on{color:var(--ink)}

.ttabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.ttab{appearance:none;border:0;background:none;color:var(--muted);font:700 13.5px var(--f-body);padding:10px 4px;border-radius:9px;cursor:pointer;position:relative}
.ttab[aria-selected="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ttab:focus-visible,.bchip:focus-visible{outline:2px solid var(--ki);outline-offset:1px}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:5px;vertical-align:middle}
.branch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bchip{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:8px 6px;cursor:pointer;display:grid;gap:2px;justify-items:center;position:relative;font:600 13px var(--f-body)}
.bchip span{font-size:12px;color:var(--muted)}
.bchip.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.bchip .tdot{position:absolute;top:6px;right:6px;margin:0}
.help-panel ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted);font-size:13.5px}

#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;--sc1:#2b2f66;--sc2:#141731;
  background:radial-gradient(ellipse at 50% -10%, var(--sc1) 0%, transparent 62%),radial-gradient(ellipse at 50% 115%, var(--sc2) 0%, transparent 58%),var(--bg);transition:opacity .5s}
#scene.flare{animation:flare 1s ease-out}
@keyframes flare{0%{filter:brightness(2.6) saturate(1.6)}100%{filter:none}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 82%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:560px;margin:0 auto;padding:18px 16px 12px;display:grid;gap:8px}
.dock-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.auto{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font:700 12.5px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.auto.on{background:var(--gold);color:var(--on-acc);border-color:var(--gold)}
.auto:focus-visible{outline:2px solid var(--ki);outline-offset:2px}
.dock .actions .btn{height:60px;overflow:hidden;padding:8px 10px}
.dock .actions .btn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn{height:7.4em;overflow:auto;align-content:start}
.status-row{min-height:26px}
.intent{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

.items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item{appearance:none;height:36px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:600 12px var(--f-body);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.item:not(:disabled){border-style:solid;border-color:var(--good);color:var(--good);background:var(--panel-2)}
.item.ally:not(:disabled){border-color:var(--hp);color:var(--hp)}
.item:disabled{opacity:.5;cursor:default}
.item:focus-visible{outline:2px solid var(--ki);outline-offset:1px}
.clash-btn{background:var(--gold);border-color:var(--gold);color:var(--on-acc);text-align:center;font-family:var(--f-display);font-size:24px;letter-spacing:.04em;animation:pulse .5s ease-in-out infinite alternate}
.clash-btn small{color:var(--on-acc);font-size:15px;opacity:.85}
@keyframes pulse{to{filter:brightness(1.15)}}
.ult-btn{height:52px;background:linear-gradient(90deg,#ffcd57,#ff7a3a,#ffcd57);background-size:200% 100%;border-color:#ffcd57;color:var(--on-acc);text-align:center;font-family:var(--f-display);font-size:20px;letter-spacing:.05em;text-transform:uppercase;animation:ultg 1.2s linear infinite}
.ult-btn small{color:var(--on-acc);opacity:.8;text-transform:none;font-family:var(--f-body);letter-spacing:0}
@keyframes ultg{to{background-position:200% 0}}
.btn.rep{border-style:dashed}
@media (prefers-reduced-motion: reduce){.ult-btn{animation:none}}
.glyph.rivalis{color:var(--hp);border-color:var(--hp);background:#3a1420}
.glyph.torna{color:var(--gold);border-color:var(--gold);border-style:double;border-width:3px}

.arena-slot{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0e1029}
.vista-slot{border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:96px;background:#0e1029}

.cwrap{display:grid;gap:9px}
.cpanel{padding:10px 12px;gap:6px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cname{display:grid;gap:1px;min-width:0}
.cname .name{font-family:var(--f-display);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpanel .pl.small{font-size:24px}
.intent-line{display:flex;align-items:center;gap:8px;min-width:0}
.intent-line .intent{padding:4px 10px;font-size:13px}
.arena-slot{min-height:176px}
.dock-in{padding:10px 16px 10px;gap:6px}
.dock .actions .btn{height:52px;padding:6px 10px;font-size:13.5px}
.dock .actions{gap:6px}
.item{height:32px}
.turn{height:5.8em;padding:9px 12px}
.end h2{font-size:34px}
@media (prefers-reduced-motion: reduce){.hit{animation:none}.bar i{transition:none}.pop{animation-duration:.01s}}

.arena-slot{min-height:250px}
.vista-slot{min-height:124px}
.hero-slot{border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:190px;background:#0e1029;margin-top:6px}
.rtag{display:grid;justify-items:end;font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--gold);line-height:1}
.rtag.bad{color:var(--hp)}
.rtag small{font-family:var(--f-body);font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px}
.dock{background:linear-gradient(to top,var(--bg) 93%,rgba(20,23,49,0))}
.glyph svg{width:22px;height:22px;display:block}
.mini{display:grid;gap:12px}
.mini-track{position:relative;height:34px;border-radius:10px;background:#0e1029;border:1px solid var(--line);overflow:hidden}
.mini-zone{position:absolute;top:0;bottom:0;background:rgba(255,205,87,.28);border-left:2px solid var(--gold);border-right:2px solid var(--gold)}
.mini-zone i{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--gold)}
.mini-cur{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--ki);box-shadow:0 0 10px var(--ki)}
.mini-hits{display:flex;gap:6px}
.mini-hits span{flex:1;height:8px;border-radius:4px;background:#0e1029;border:1px solid var(--line)}
.mini-hits span.p{background:var(--gold);border-color:var(--gold)}
.mini-hits span.g{background:var(--ki);border-color:var(--ki)}
.mini-hits span.m{background:var(--hp);border-color:var(--hp);opacity:.6}
.mini-bag{font-family:var(--f-display);font-size:40px;line-height:1;text-align:center;color:var(--gold);min-height:44px}
.mini-bag.popin{animation:pop2 .35s ease-out}
@keyframes pop2{0%{transform:scale(1.5)}100%{transform:none}}
.btn.hitbtn{height:64px;text-align:center;font-family:var(--f-display);font-size:24px;letter-spacing:.06em;background:var(--hp);border-color:var(--hp);color:var(--on-acc)}

.story{border-color:var(--gold);background:linear-gradient(180deg,#2a2550,var(--panel))}
.story h2{font-size:26px;color:var(--gold)}
.story p{line-height:1.55;max-width:62ch}
.namerow{display:grid;grid-template-columns:1fr auto;gap:8px}
.namerow input{min-width:0;background:#0e1029;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:600 15px var(--f-body)}
.namerow input:focus-visible{outline:2px solid var(--ki);outline-offset:1px}
.namerow .btn{width:auto;text-align:center}
.stat-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.stat-row>div{min-width:0}
.pm{display:grid;grid-template-columns:44px 44px;gap:6px}
.pm .btn{text-align:center;font-size:20px;padding:6px}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:18px;height:8px;border-radius:3px;background:#0e1029;border:1px solid var(--line)}
.pips i.on{background:var(--ki);border-color:var(--ki)}

.art-slot{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0e1029}
.story .art-slot{margin:-4px -4px 2px}
.beltdot{display:inline-block;width:22px;height:7px;border-radius:2px;margin-right:8px;vertical-align:middle;border:1px solid rgba(255,255,255,.35)}
.orbdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}

.walls{display:grid;gap:4px}
.wall{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:#0e1029;border:1px solid var(--line);font-size:13.5px}
.wall span:first-child{font-family:var(--f-display);color:var(--muted)}
.wall b{color:var(--hp);font-family:var(--f-display);font-weight:600}
.wall.done{opacity:.6}.wall.done b{color:var(--good)}
.wall.next{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.bossline{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
</style>

<div id="scene" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>

<script>
(function(){
const app=document.getElementById('app');
const KEY='egtorony:v1';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=n=>Math.round(n).toLocaleString('hu-HU');
const pct=n=>Math.round(n*100)+'%';
const fx=v=>v.toLocaleString('hu-HU',{maximumFractionDigits:1})+'×';
// névelő számok elé: az 1., az 5., az 50–59., az 500–599., az 1000–1999., a többi elé "a"
const az=n=>{n=Math.round(n);return (n===1||/^5/.test(String(n))||(n>=1000&&n<2000))?'az':'a'};
// nagy számok olvashatóan: 178,6 millió, 380,5 billió
const SCALE=[[1e6,'millió','milliót'],[1e9,'milliárd','milliárdot'],[1e12,'billió','billiót'],[1e15,'billiárd','billiárdot'],[1e18,'trillió','trilliót'],[1e21,'trilliárd','trilliárdot'],[1e24,'kvadrillió','kvadrilliót'],[1e27,'kvadrilliárd','kvadrilliárdot'],[1e30,'kvintillió','kvintilliót'],[1e33,'kvintilliárd','kvintilliárdot'],[1e36,'szextillió','szextilliót']];
const big=n=>{if(!isFinite(n))return '∞';if(n>=1e39){const e=Math.floor(Math.log10(n));return (n/Math.pow(10,e)).toLocaleString('hu-HU',{maximumFractionDigits:1})+'·10^'+e}for(let i=SCALE.length-1;i>=0;i--)if(n>=SCALE[i][0])return (n/SCALE[i][0]).toLocaleString('hu-HU',{maximumFractionDigits:1})+' '+SCALE[i][1];return fmt(n)};
// erőszint kiírása: milliárd alatt pontosan, fölötte rövidítve, hogy elférjen
const plf=n=>n>=1e9?big(n):fmt(n);
// átalakulások aurája
const AURA=[null,'kék','vörös','ezüst','fehér','arany','bíbor','szivárványló'];
const SHOUT=['Összegyűjtöd a ki-t a tenyeredben…','A ki a markodban izzik, a levegő vibrál…','Hátrahúzod a kezed, a padló megreped alattad…','Felordítasz, és minden erődet egy pontba sűríted…'];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=Math.random()*t;for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]}

  (r.techs||[]).forEach(t=>{if(map[t])r.skills[map[t]]=Math.min(3,(r.skills[map[t]]||0)+1);if(fm[t])r.form=Math.max(r.form,fm[t])});

function genReward(t){

function miniPos(M){const per=Math.max(420,1050-M.hits.length*130);const u=((Date.now()-M.t0)/per)%2;return u<1?u:2-u}
function miniHit(){const r=S.run,M=r.ev&&r.ev.mini;if(!M||M.hits.length>=5)return;
  const p=miniPos(M),dd=Math.abs(p-M.zone),half=M.w/2;const res=dd<=half*.35?'p':dd<=half?'g':'m';
  M.hits.push(res);M.hitAt=Date.now();M.last=res==='p'?'TÖKÉLETES!':res==='g'?'Jó ütés':'Mellé';
  M.zone=rnd(.18,.82);M.w=Math.max(.11,.22-M.hits.length*.025);M.t0=Date.now()-Math.random()*800;
  if(M.hits.length>=5){const sc=M.hits.reduce((a,x)=>a+(x==='p'?2:x==='g'?1:0),0);const gain=addPL(.06*sc);r.ev.mini=null;r.ev.done=true;
    flash(sc>=9?'A zsák varrása szétreped. Erőszint +'+plf(gain)+'. Ezt még a vízesés is megirigyelné.':sc>=5?'Jó edzés volt. Erőszint +'+plf(gain)+'.':sc>0?'Ma nem ment igazán. Erőszint +'+plf(gain)+'.':'A zsák nyert. Holnap újra.')}}

function endRun(finished){
  const r=S.run;if(finished&&r.screen==='victory')r.floor=Math.max(r.floor,30);
  try{vsMaszas(r.mode==='vegtelen'&&!finished?r.floor+1:r.floor,r.pl||0,!!r.won&&r.mode!=='vegtelen')}catch(e){}
  const ascMult=1+.15*(r.asc||0);
  const pts=Math.round((r.floor+r.bosses*8+r.elites*2+(r.won?30:0))*ascMult*(1+.1*lv('aranyer')));
  if(r.mode==='vegtelen'){const fl=finished?r.floor:r.floor+1;if(fl>(S.meta.vBest||0))jot('Új végtelen rekord: '+fl+'. emelet.');S.meta.vBest=Math.max(S.meta.vBest||0,fl);S.meta.vPL=Math.max(S.meta.vPL||0,r.pl)}
  const r0=rankIdx(S.meta.total||0);
  const xp=Math.round((r.floor*4+r.bosses*20+r.elites*6+(r.won?80:0))*ascMult);const lvUp=gainXP(xp);const cc=ch();enTick();cc.en=Math.min(enMax(),cc.en+3);
  S.meta.pts+=pts;S.meta.total+=pts;S.meta.best=Math.max(S.meta.best,r.floor);
  const r1=rankIdx(S.meta.total);let rankUp=null;
  if(r1>r0){rankUp=RANKS.slice(r0+1,r1+1).map(x=>({n:x[1],u:x[2]}));rankUp.forEach(x=>jot('Új rangot értél el: '+x.n+'.'))}
  S.meta.history=S.meta.history||[];
  S.meta.history.unshift({mode:r.mode==='vegtelen'?'v':undefined,n:S.meta.runs,floor:finished?r.floor:r.floor+1,won:!!r.won,fin:!!finished,asc:r.asc||0,school:r.school,pl:Math.round(r.pl),kills:r.kills,form:r.form,skills:Object.keys(r.skills).map(k=>LINES[k].t[r.skills[k]-1].n),relics:r.relics.map(x=>RELICS[x].n),pts});
  S.meta.history=S.meta.history.slice(0,10);
  r.screen='end';r.end={finished,pts,floor:finished?r.floor:r.floor+1,rankUp,xp,lvUp,sh:r.shGot||0};C=null;r.c=null;
}

const EN_REGEN=4*60000;
const enMax=()=>6+Math.floor(ch().lvl/5);
function enTick(){const c=ch(),mx=enMax();if(c.en>=mx){c.enT=Date.now();return}const k=Math.floor((Date.now()-(c.enT||Date.now()))/EN_REGEN);if(k>0){c.en=Math.min(mx,c.en+k);c.enT=(c.enT||Date.now())+k*EN_REGEN;if(c.en>=mx)c.enT=Date.now()}}
let TG=null;
function tPos(){const per=Math.max(240,(1050-TG.hits.length*130)/TG.sp);const u=((Date.now()-TG.t0)/per)%2;return u<1?u:2-u}
function tStart(id){if(TG&&!TG.done)return;enTick();const c=ch(),s=SPOTS.find(x=>x.id===id);if(!s||c.lvl<s.lv||c.en<1)return;c.en--;c.lastSpot=id;TRAIN.fx=null;TRAIN.parts=[];TG={id,sp:s.sp,hits:[],t0:Date.now(),zone:rnd(.3,.7),w:.22,last:'',done:false}}
function tHit(){if(!TG||TG.done||TG.hits.length>=5)return;
  const p=tPos(),dd=Math.abs(p-TG.zone),half=TG.w/2;const res=dd<=half*.35?'p':dd<=half?'g':'m';
  TG.hits.push(res);tfxHit(res);TG.last=res==='p'?'TÖKÉLETES!':res==='g'?'Jó ütés':'Mellé';
  TG.zone=rnd(.18,.82);TG.w=Math.max(.1,.22-TG.hits.length*.025);TG.t0=Date.now()-Math.random()*800;
  if(TG.hits.length<5)return;
  const c=ch(),s=SPOTS.find(x=>x.id===TG.id),sc=TG.hits.reduce((a,x)=>a+(x==='p'?2:x==='g'?1:0),0);
  const xp=Math.round(s.xp*(.3+.1*sc));const up=gainXP(xp);let sh=0;
  if(sc>=10)sh++;else if(Math.random()<s.sh*sc/10)sh++;
  c.spots[s.id]=(c.spots[s.id]||0)+1;c.trainN=(c.trainN||0)+1;
  let mast='';if(c.spots[s.id]===10){sh+=2;mast=' Tíz edzés után kiismered a helyet: +2 égszilánk.';jot('Kitanultad az edzőhelyet: '+s.n+'.')}
  if(sh)addSh(sh);
  TG.done=true;TG.sc=sc;TG.xp=xp;TG.up=up;TG.doneAt=Date.now();TG.res=(sc>=10?'Tökéletes edzés. ':sc>=6?'Jó edzés volt. ':sc>0?'Ma nem ment igazán. ':'Az ütőzsák nyert. ')+'+'+xp+' tapasztalat'+(sh?', +'+sh+' égszilánk':'')+'.'+(up?' <b>Szintet léptél: '+c.lvl+'. szint, +'+(3*up)+' elosztható pont.</b>':'')+mast;
}

function floorBar(f){const base=(actOf(f)-1)*10;let h='<div class="floorbar" aria-hidden="true">';for(let i=1;i<=10;i++){const fl=base+i;h+='<span class="'+(i===10?'boss ':'')+(fl<=S.run.floor?'done':fl===f?'now':'')+'"></span>'}return h+'</div>'}
function skillChips(r){
  let h='<div class="row"><span class="label">Technikák · '+lineCount(r)+' / '+slots()+' hely</span></div><div class="chips">';
  (r.fused||[]).forEach(p=>{h+='<span class="chip gold">'+fname(p)+'</span>'});
  Object.keys(r.skills).filter(id=>!(r.fused||[]).some(p=>p.includes(id))).forEach(id=>{h+='<span class="chip ki">'+tier(id).n+' '+roman(r.skills[id])+'</span>'});
  if(r.form)h+='<span class="chip gold">'+FORMS[r.form].n+'</span>';
  return h+'</div>';
}

// ---- Multiverzum-bajnokság: heti rangsor más játékosokkal ----
// Egy nyilvános MQTT üzenetközvetítőn (HiveMQ, mint a Raktár 3D-ben és a Lőtér Űrversenyében) megy át a játékosok
// neve és heti eredménye; saját szerver nincs. Témák (VS_CS/...):
//   <játék>/<hét>/<azonosító>  – megőrzött heti eredmény: {id, nev, v:{...}, ts}
//   jelen/<játék>/<azonosító>  – megőrzött jelenlét (a kapcsolat megszakadásakor a szerver törli)
//   <játék>/e                  – élő hírek: {id, nev, t}
// Hétfőn új hét, új rangsor; az előző hét győztese (ha legalább ketten versenyeztek) egyszeri jutalmat kap.
const VS_BROKER='wss://broker.hivemq.com:8884/mqtt',VS_CS='multiverzum-bajnoksag-r4w8';
function vsHet(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const e=t.getUTCFullYear();return e+'-W'+String(Math.ceil(((t-Date.UTC(e,0,1))/864e5+1)/7)).padStart(2,'0')}
function inditVerseny({jatek,ertek,rendez,jutalom,valtozott}){
  const id=(()=>{let i;try{i=localStorage.getItem('multiverzum-id')}catch(e){}if(!i){i=Math.random().toString(36).slice(2,10);try{localStorage.setItem('multiverzum-id',i)}catch(e){}}return i})();
  const V={be:false,het:vsHet(),lap:{},elozo:{},jelen:{},hirek:[],k:null,kuld:'',uz:'Kapcsolódás…',id};
  V.elozoHet=vsHet(new Date(Date.now()-7*864e5));
  V.nev=()=>{try{return localStorage.getItem('multiverzum-nev')||''}catch(e){return ''}};
  V.nevBe=n=>{n=String(n||'').trim().slice(0,24);try{localStorage.setItem('multiverzum-nev',n)}catch(e){}V.kuld='';V.kozol();jelenKuld()};
  const tiszta=o=>o&&typeof o.id==='string'&&o.v&&typeof o.v==='object'?{id:o.id,nev:String(o.nev||'?').slice(0,24),v:o.v,ts:+o.ts||0}:null;
  V.rangsor=(L=V.lap,sajat=true)=>{const l={...L};if(sajat){const v=ertek();if(v)l[id]={id,nev:V.nev()||'Névtelen',v,ts:Date.now()}}
    return Object.values(l).filter(Boolean).map(x=>({...x,en:x.id===id})).filter(x=>x.en||Object.values(x.v).some(v=>+v>0)).sort((a,b)=>rendez(a.v,b.v))};
  const jt=()=>VS_CS+'/jelen/'+jatek+'/'+id;
  function jelenKuld(){if(V.be)V.k.publish(jt(),JSON.stringify({nev:V.nev()||'Névtelen'}),{qos:0,retain:true})}
  V.kozol=()=>{if(!V.be||!V.nev())return;const v=ertek();if(!v)return;const s=JSON.stringify(v);if(s===V.kuld)return;V.kuld=s;
    V.k.publish(VS_CS+'/'+jatek+'/'+V.het+'/'+id,JSON.stringify({id,nev:V.nev(),v,ts:Date.now()}),{qos:0,retain:true})};
  V.hir=t=>{if(V.be&&V.nev())V.k.publish(VS_CS+'/'+jatek+'/e',JSON.stringify({id,nev:V.nev(),t:String(t).slice(0,140)}),{qos:0})};
  V.fent=()=>Object.keys(V.jelen).length;
  // az előző hét győztese: egyszer, ha mi voltunk az elsők (és nem egyedül)
  let bajnokNezve=false;
  function bajnokCsekk(){if(bajnokNezve)return;const R=V.rangsor(V.elozo,false);if(R.length<2||R[0].id!==id)return;bajnokNezve=true;
    let n={};try{n=JSON.parse(localStorage.getItem('univerzum-naplo'))||{}}catch(e){}const k=jatek+':bajnok:'+V.elozoHet;if(n[k])return;
    n[k]=Date.now();try{localStorage.setItem('univerzum-naplo',JSON.stringify(n))}catch(e){}jutalom(V.elozoHet,R.length)}
  (async()=>{let mqtt;try{const mod=await import('./vendor/mqtt/mqtt.esm.js');mqtt=mod.default?.connect?mod.default:mod.default?.default??mod}catch(e){V.uz='A versenyhez nem sikerült betölteni a hálózati könyvtárat.';valtozott();return}
    V.k=mqtt.connect(VS_BROKER,{clientId:jatek+'_'+id+'_'+Math.random().toString(36).slice(2,6),clean:true,keepalive:30,reconnectPeriod:5000,connectTimeout:10000,will:{topic:jt(),payload:'',qos:0,retain:true}});
    V.k.on('connect',()=>{V.be=true;V.uz='';V.het=vsHet();V.k.subscribe(VS_CS+'/'+jatek+'/'+V.het+'/+');V.k.subscribe(VS_CS+'/'+jatek+'/'+V.elozoHet+'/+');
      V.k.subscribe(VS_CS+'/jelen/'+jatek+'/+');V.k.subscribe(VS_CS+'/'+jatek+'/e');jelenKuld();V.kuld='';V.kozol();valtozott();setTimeout(bajnokCsekk,4000)});
    V.k.on('close',()=>{if(V.be){V.be=false;V.uz='A kapcsolat megszakadt, újrapróbálom…';valtozott()}});
    V.k.on('error',e=>console.warn('[verseny]',e?.message||e));
    V.k.on('message',(tema,adat)=>{const r=tema.slice(VS_CS.length+1).split('/');let o=null;try{const s=adat.toString();o=s?JSON.parse(s):null}catch(e){return}
      if(r[0]==='jelen'){if(r[2]===id)return;if(o)V.jelen[r[2]]=String(o.nev||'?').slice(0,24);else delete V.jelen[r[2]]}
      else if(r[1]==='e'){if(!o||o.id===id)return;V.hirek.unshift({nev:String(o.nev||'?').slice(0,24),t:String(o.t||'').slice(0,140),ido:Date.now()});V.hirek.length=Math.min(V.hirek.length,6);valtozott(V.hirek[0]);return}
      else if(r[1]===V.het||r[1]===V.elozoHet){if(r[2]===id&&r[1]===V.het)return;const L=r[1]===V.het?V.lap:V.elozo;const x=tiszta(o);if(x&&x.id===r[2])L[r[2]]=x;else delete L[r[2]]}
      valtozott()})})();
  return V}

function chooseAction(){
  const r=S.run,e=C.e,hpP=r.hp/r.maxhp,pe=pEff(),av=v=>{if(v.startsWith('t:')){const id=v.slice(2);if(r.skills[id]&&isF(id)){const i=(r.fused||[]).findIndex(p=>p.includes(id));return canFuse(r.fused[i])}return !!r.skills[id]&&canUse(id)}return true},
    sub=v=>{if(v.startsWith('t:')&&isF(v.slice(2)))return 'f:'+(r.fused||[]).findIndex(p=>p.includes(v.slice(2)));return v};
  const bag=r.bag||[];
  if((C.mom||0)>=MOMMAX)return 'ult';
  if(allyReady()&&!C.allyUsed&&e.hp>e.maxhp*.3)return 'ally';
  if(r.skills.ido&&!isF('ido')&&canUse('ido')&&C.ki-tcost('ido')>=45&&e.hp>e.maxhp*.25)return 't:ido';
  if(hpP<.25&&bag.includes('bab'))return 'item:'+bag.indexOf('bab');
  if((e.boss||C.t==='elit')&&!C.rage&&bag.includes('paprika'))return 'item:'+bag.indexOf('paprika');
  if(r.form&&!C.formOn&&C.ki>=kc(FORMS[r.form].ki)&&(e.pl>r.pl*.9||e.boss||C.t==='elit')&&C.ki-kc(FORMS[r.form].ki)>=formDrain())return 'form';

  (r.fused||[]).forEach((p,i)=>{if(!canFuse(p))return;let d=fexp(p);if(!d)return;if(pe/e.pl>=5)d=e.hp;if(d>bd*1.15||(d>=e.hp&&bd<e.hp)){bd=d;best='f:'+i}});
  Object.keys(r.skills).filter(id=>!isF(id)).forEach(id=>{if(!canUse(id))return;const t=tier(id);let d=0;
    if(id==='kitores'){if(C.ki<r.maxki*.8&&C.ki*t.per/10*15<e.hp)return;d=expHit(C.ki/10*t.per)}
    else if(id==='sarkany'){if((C.mom||0)>=3&&C.mom<MOMMAX)return;d=expHit(t.m+t.per*(C.mom||0))}

  if(hpP<.35&&av('t:legzes'))return sub('t:legzes');
  const atk=['atk','heavy','multi','drain'].includes(e.intent)&&!e.stun;
  const exp=atk?dmgCalc(e.pl,pe,e.intent==='heavy'?2.4:e.intent==='multi'?1.65:e.intent==='drain'?.6:1,7,true):0;

  return best;
}

    clashTimer=setTimeout(resolveClash,left);clashTick=setInterval(()=>{const el=document.getElementById('ctime');if(el)el.textContent=Math.max(0,(c.end-Date.now())/1000).toLocaleString('hu-HU',{minimumFractionDigits:1,maximumFractionDigits:1})},100);return}
  if(screen!=='title'&&S.run&&S.run.screen==='combat'&&S.meta.auto)autoTimer=setTimeout(autoStep,S.run.c&&S.run.c.ph2?2100:S.run.c&&S.run.c.meteor===null&&S.run.c.last&&S.run.c.last.sys&&S.run.c.last.sys.some(x=>x.includes('becsapódik'))?1700:700);
}
function animNums(){
  app.querySelectorAll('[data-count]').forEach(el=>{
    const k=el.dataset.key,to=+el.dataset.count,from=prev[k]??to;prev[k]=to;
    if(from===to||reduced){el.textContent=plf(to);return}
    el.textContent=plf(from);const t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/650);el.textContent=plf(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

// ---------- vezérlés ----------
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled||koLock)return;
  const a=b.dataset.a,v=b.dataset.v,m=S.meta;
  if(a!=='abandon'&&a!=='exit'&&a!=='importsave')armed=null;
  if(a==='start'){newRun();screen='game'}
  else if(a==='startv'){newRun('vegtelen');screen='game'}
  else if(a==='cont'){screen='game'}
  else if(a==='vsnev'){const el=document.getElementById('vsNev');if(el&&el.value.trim())VS.nevBe(el.value)}
  else if(a==='menu'){screen='title'}
  else if(a==='ttab'){titleTab=v;copyText='';saveText='';saveMsg=''}
  else if(a==='exportsave'){saveText=exportCode();saveMsg='Másolás…';try{navigator.clipboard.writeText(saveText).then(()=>{saveMsg='A mentéskód a vágólapon van. Tedd el biztos helyre.';render()}).catch(()=>{saveMsg='Az automatikus másolás nem működik: tartsd nyomva a lenti kódot, és másold ki.';render()})}catch(err){saveMsg='Tartsd nyomva a lenti kódot, és másold ki.'}}
  else if(a==='importsave'){const box=document.getElementById('importbox');const txt=box?box.value:'';
    if(armed!=='import'){if(!txt.trim()){saveMsg='Előbb illeszd be a kódot.';render();return}window.__imp=txt;armed='import';render();const b2=document.getElementById('importbox');if(b2)b2.value=txt;return}
    armed=null;try{const d=importCode(window.__imp||txt);S={meta:Object.assign(freshMeta(),d.meta),run:migrate(d.run||null)};localStorage.setItem(KEY,JSON.stringify(S));saveMsg='Betöltve. Üdv újra, '+RANKS[rankIdx(S.meta.total||0)][1]+'!';prev={}}catch(err){saveMsg='Nem sikerült: '+err.message}}
  else if(a==='auto'){m.auto=!m.auto}
  else if(a==='clash'){const c=S.run&&S.run.c&&S.run.c.clash;if(c&&Date.now()<c.end){c.taps++;const el=document.getElementById('ctaps');if(el)el.textContent=c.taps}return}
  else if(a==='copylog'){copyText=buildLog();copyMsg='Másolás…';
    try{navigator.clipboard.writeText(copyText).then(()=>{copyMsg='Kimásolva. Illeszd be a beszélgetésbe.';render()}).catch(()=>{copyMsg='Az automatikus másolás itt nem működik: tartsd nyomva a lenti szöveget, és másold ki.';render()})}catch(err){copyMsg='Az automatikus másolás itt nem működik: tartsd nyomva a lenti szöveget, és másold ki.'}}
  else if(a==='mbr'){metaBranch=v}
  else if(a==='meta'){const u=META.find(x=>x.id===v),l=lv(u.id);if(metaOpen(u)&&l<u.max&&m.pts>=u.cost(l)){m.pts-=u.cost(l);m.up[u.id]=l+1}}
  else if(a==='school'){const s=SCHOOLS.find(x=>x.id===v);if(!m.schools.includes(s.id)){if(m.pts<s.cost)return;m.pts-=s.cost;m.schools.push(s.id)}m.school=s.id}
  else if(a==='asc'){m.asc=clamp((m.asc||0)+(v==='+'?1:-1),0,m.maxAsc||0)}
  else if(a==='abandon'){if(armed!=='abandon'){armed='abandon'}else{armed=null;endRun(false);screen='game'}}
  else if(a==='node'){enterNode(S.run.choices[+v])}
  else if(a==='cmb'){if(performance.now()<ARENA.busy)return;C=S.run.c;const before=S.run.c;combatAction(v);if(afterCombatStep(before)){save();return}}
  else if(a==='rew'){applyOpt(S.run.rew.opts[+v]);finishFloor()}
  else if(a==='skip'){finishFloor()}
  else if(a==='endless'){S.run.screen='reward'}
  else if(a==='finish'){endRun(true)}
  else if(a==='temple'){startCombat('temple')}
  else if(a==='path'){if(!S.run&&mst(v)>=1){m.path=v}}
  else if(a==='exit'){if(armed!=='exit'){armed='exit'}else{armed=null;endRun(true)}}
  else if(a==='ev'){const vw=evView(),o=vw.o[+v];if(o.sold||(o.p&&S.run.cr<o.p))return;const res=o.f();if(res!=='combat'&&res!=='mini'&&!vw.shop){S.run.ev.done=true;if(!flashMsg)finishFloor()}}
  else if(a==='leave'){flashMsg='';finishFloor()}
  else if(a==='mhit'){miniHit()}
  else if(a==='home'){S.run=null;screen='title'}
  else if(a==='seen'){const c=ch();c.seen=Math.min(c.story,c.seen+1)}
  else if(a==='ending'){const c=ch();if(c.story===STORY.length-1&&!c.end&&ENDINGS[v]){c.end=v;c.seen=c.story;jot('A krónika véget ért: '+ENDINGS[v].n+'.');titleTab='kronika'}}
  else if(a==='setname'){const el=document.getElementById('cname');ch().name=(el?el.value:'').trim().slice(0,18)}
  else if(a==='stat'){const [id,d]=v.split(':'),c=ch();if(S.run&&S.run.screen!=='end')return;if(d==='+'&&freePts()>0)c.st[id]++;if(d==='-'&&c.st[id]>0)c.st[id]--}
  else if(a==='statall'){if(!(S.run&&S.run.screen!=='end'))ch().st.ero+=freePts()}
  else if(a==='abuy'){const c=ch(),A2=ABIL[v];if(A2&&!c.own.includes(v)&&c.sh>=A2.c){c.sh-=A2.c;c.own.push(v);if(c.eq.length<eqSlots()&&!(S.run&&S.run.screen!=='end'))c.eq.push(v)}}
  else if(a==='aeq'){const c=ch();if(S.run&&S.run.screen!=='end')return;const i=c.eq.indexOf(v);if(i>=0)c.eq.splice(i,1);else if(c.own.includes(v)&&c.eq.length<eqSlots())c.eq.push(v)}
  else if(a==='tspot'){TG=null;tStart(v);render();const el=document.getElementById('train-slot'),nav=app.querySelector('.ttabs');if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-(nav?nav.offsetHeight:0)-10,behavior:reduced?'auto':'smooth'});return}
  else if(a==='thit'){tHit();if(TG&&!TG.done){const sc=TG.hits.reduce((x,y)=>x+(y==='p'?2:y==='g'?1:0),0);const bag=app.querySelector('.mini-bag');if(bag){bag.textContent=TG.last;bag.classList.remove('popin');void bag.offsetWidth;bag.classList.add('popin')}const z=app.querySelector('.mini-zone');if(z){z.style.left=((TG.zone-TG.w/2)*100).toFixed(1)+'%';z.style.width=(TG.w*100).toFixed(1)+'%'}const hs=app.querySelectorAll('.mini-hits span');TG.hits.forEach((x,i)=>{if(hs[i])hs[i].className=x});const lb=app.querySelector('.mini .chip');if(lb)lb.textContent=sc+' / 10 pont';const lab=app.querySelector('.mini .label');if(lab)lab.textContent=SPOTS.find(x=>x.id===TG.id).n+' · '+TG.hits.length+' / 5 ütés';return}}
  else if(a==='tback'){TG=null}
  render();
  if(['node','rew','skip','leave','start','cont','home','endless','finish'].includes(a))window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
});

function start(data){
  let stored=null;try{const raw=localStorage.getItem(KEY);if(raw)stored=JSON.parse(raw)}catch(e){}
  if(data&&data.state&&progressOf(data.state)>=progressOf(stored)){S=data.state;S.meta=Object.assign(freshMeta(),S.meta);S.run=migrate(S.run);if(S.run&&S.run.restart){const t=S.run.restart;delete S.run.restart;startCombat(t)}}else load();
  if(S.run&&S.run.c)C=S.run.c;
  try{window.claude?.hot?.snapshot?.(()=>({state:S}))}catch(e){}
  screen='title';render();
  cloudInit();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
